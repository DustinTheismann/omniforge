name: Lean verification

on:
  push:
    paths:
      - 'fricas_bridge/**/*.lean'
      - 'fricas_bridge/lakefile.lean'
      - 'fricas_bridge/lean-toolchain'
      - 'fricas_bridge/lake-manifest.json'
      - '.github/workflows/lean.yml'
  pull_request:
    paths:
      - 'fricas_bridge/**/*.lean'
      - 'fricas_bridge/lakefile.lean'
      - 'fricas_bridge/lean-toolchain'

jobs:
  verify:
    name: Typecheck Lean proofs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSfL \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      # Cache the Lean toolchain binary so subsequent runs skip the download.
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('fricas_bridge/lean-toolchain') }}

      # Cache Mathlib oleans so subsequent runs skip the multi-hour rebuild.
      - name: Cache Mathlib oleans
        uses: actions/cache@v4
        with:
          path: ~/.cache/mathlib
          key: mathlib-${{ runner.os }}-${{ hashFiles('fricas_bridge/lakefile.lean') }}
          restore-keys: |
            mathlib-${{ runner.os }}-

      - name: Guard verified lib roots against sorry/axiom
        run: |
          # Structural soundness check: none of the five verified library
          # roots may contain sorry, admit, or a top-level axiom declaration.
          # coqc/Lean accept these silently, so CI green without this guard
          # is meaningless.  FriCAS_Bridge_Demo.lean and output/risch/*.lean
          # are intentionally excluded (they are demos/drafts, not verified libs).
          VERIFIED_ROOTS=(
            fricas_bridge/RischVerification.lean
            fricas_bridge/RischAutoDischarge.lean
            fricas_bridge/PartialFractionHasDerivAt.lean
            fricas_bridge/FriCASTranslator.lean
            fricas_bridge/FriCASParser.lean
          )
          if grep -nE '\bsorry\b|\badmit\b|^axiom ' "${VERIFIED_ROOTS[@]}"; then
            echo "::error::sorry/admit/axiom found in a verified library root — proof is unsound"
            exit 1
          fi
          echo "All verified lib roots are sorry/axiom-free."

      - name: Resolve dependencies and typecheck
        working-directory: fricas_bridge
        run: |
          # elan reads lean-toolchain, installs leanprover/lean4:v4.30.0,
          # then resolves the Mathlib dependency graph.
          lake update
          # Download pre-built Mathlib olean files (falls back to source build).
          lake exe cache get || true
          # Typecheck RischVerification.lean against Mathlib.
          lake build

      - name: Report verified theorems
        run: |
          echo "All Lean proofs typechecked against Mathlib."
          echo ""
          echo "Kernel-verified integration certificates:"
          echo "  risch_verified_bronstein_1  ∫ (2x·ln(x²+1)+x³)/(x²+1) dx"
          echo "  risch_simple_log            ∫ x/(x²+1) dx"
          echo "  risch_arctan                ∫ 2x/(1+x⁴) dx"
          echo "  risch_partial_fractions     ∫ (x+1)/(x(x+2)) dx  [x≠0, x≠-2]"
          echo ""
          echo "Scaling-law theorem (Tier 1.4):"
          echo "  partial_fraction_hasDerivAt  general n-pole Σ cᵢ·log(x-aᵢ) derivative"
          echo "  partial_fraction_one_pole    n=1 specialisation"
