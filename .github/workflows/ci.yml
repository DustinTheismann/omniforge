name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Install SAT toolchain (cadical + drat-trim + lrat-trim + cake_lpr)
        run: bash scripts/tools/install_sat_toolchain.sh

      - name: Install Python package
        run: pip install -e .

      - name: Validate contracts
        run: make validate-contracts

      - name: Demo (three-checker UNSAT)
        run: make demo

      - name: E9 SAT anchor (cake_lpr re-checks gf2 tautology refutation)
        run: make gf2

      - name: E9 non-toy SAT anchor (cake_lpr re-checks Tseitin C5 refutation)
        run: make tseitin

      - name: Upload demo artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sat-demo-bundle
          path: artifacts/
